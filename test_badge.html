<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --primary: #2C8C99;
  }
  .text-gradient {
    background: linear-gradient(135deg, var(--primary), #4AABB8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
  <h3 class="text-gradient" style="font-size: 24px; font-family: sans-serif; display: flex; align-items: center;">
    <span style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #ffffff; font-size: 17px; font-weight: bold; margin-right: 12px; flex-shrink: 0; -webkit-text-fill-color: #ffffff;">1</span>
    Beschrijf de situatie
  </h3>
</body>
</html>
